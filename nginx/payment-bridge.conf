# N-Genius return/cancel: Nest excludes these from the /api prefix.
# Independent Malahem compose publishes the API as `api` (alias butcher-api).
# Do not send these paths to Expo web — there is no `web` service.
location = /payment/result {
  set $api_upstream api:3001;
  proxy_pass http://$api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /payment/cancel {
  set $api_upstream api:3001;
  proxy_pass http://$api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
