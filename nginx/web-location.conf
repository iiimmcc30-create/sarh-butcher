# Leftover Expo-web catch-all. Independent Malahem compose has no `web`
# service — nginx.prod.conf does not include this file.
# Keep only if an operator later adds a static Expo web container.
location / {
  set $web_upstream web:80;
  proxy_pass http://$web_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
