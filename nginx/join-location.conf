# Kept as a reference snippet. Production nginx inlines /join next to /privacy
# in nginx.prod.conf and nginx.ssl.server.conf so a missing include cannot
# leave the Expo unmatched route in place.
location = /join {
  set $api_upstream api:3001;
  proxy_pass http://$api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /join/success {
  set $api_upstream api:3001;
  proxy_pass http://$api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
