# Independent Malahem locations. Upstreams are host publishes on the
# sarh_internal gateway (172.20.0.1) so Sarh nginx never joins malahem_internal
# and never resolves the short names api/socket/admin/butcher.

location ^~ /.well-known/acme-challenge/ {
  root /var/www/certbot;
  default_type text/plain;
}

location /api/ {
  proxy_pass http://172.20.0.1:3101;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

location /uploads/ {
  proxy_pass http://172.20.0.1:3101;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /health {
  proxy_pass http://172.20.0.1:3101/api/health;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

