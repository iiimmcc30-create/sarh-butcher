# Independent ملاحم سرح API on the shared sarhsa.online host.
# Longer than /api/ and uses ^~ so SARH /api/ never receives these requests.
# Trailing slash avoids colliding with SARH /api/butchers and /api/butcher-applications.
#
# Public:  https://sarhsa.online/api/butcher/api/butchers/...
# Upstream butcher Nest keeps its existing /api prefix (local :3001 unchanged).

location ^~ /api/butcher/socket.io/ {
  set $butcher_socket_upstream socket:3002;
  rewrite ^/api/butcher/(.*)$ /$1 break;
  proxy_pass http://$butcher_socket_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 86400;
  proxy_send_timeout 86400;
}

location ^~ /api/butcher/ {
  set $butcher_api_upstream api:3001;
  rewrite ^/api/butcher/(.*)$ /$1 break;
  proxy_pass http://$butcher_api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

location = /api/butcher {
  return 301 /api/butcher/;
}
