# Optional Malahem path-prefix compatibility.
# Use only if a public host still publishes Nest under /api/butcher.
# Independent dedicated hosts should use /api/ and /socket.io/ instead.
#
# Public (canonical):  /api/butcher/butchers/checkout
# Public (compat):     /api/butcher/api/butchers/checkout
# Upstream Nest:       /api/butchers/checkout
#
# Upstreams resolve on malahem_internal as `api` / `socket`
# (aliases butcher-api / butcher-socket).

location ^~ /api/butcher/socket.io/ {
  set $butcher_socket_upstream socket:3002;
  rewrite ^/api/butcher/(.*)$ /$1 break;
  proxy_pass http://$butcher_socket_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 86400;
  proxy_send_timeout 86400;
}

location = /api/butcher/join {
  set $butcher_api_upstream api:3001;
  proxy_pass http://$butcher_api_upstream/join;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/butcher/join/success {
  set $butcher_api_upstream api:3001;
  proxy_pass http://$butcher_api_upstream/join/success;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/butcher/privacy {
  set $butcher_api_upstream api:3001;
  proxy_pass http://$butcher_api_upstream/privacy;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/butcher/payment/result {
  set $butcher_api_upstream api:3001;
  proxy_pass http://$butcher_api_upstream/payment/result;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/butcher/payment/cancel {
  set $butcher_api_upstream api:3001;
  proxy_pass http://$butcher_api_upstream/payment/cancel;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/butcher/uploads/ {
  set $butcher_api_upstream api:3001;
  rewrite ^/api/butcher/uploads/(.*)$ /uploads/$1 break;
  proxy_pass http://$butcher_api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/butcher/ {
  set $butcher_api_upstream api:3001;
  rewrite ^/api/butcher/api/(.*)$ /api/$1 break;
  rewrite ^/api/butcher/(.*)$ /api/$1 break;
  proxy_pass http://$butcher_api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

location = /api/butcher {
  return 301 /api/butcher/;
}
