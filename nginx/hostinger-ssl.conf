# Live Hostinger TLS edge. Bind-mounted over Sarh nginx ssl-server.conf.
# Preserves sarhsa.online. Malahem TLS is appended by vps-p5-apply-public.sh
# only after the malahem.sarhsa.online certificate exists.

server {
  listen 443 ssl;
  http2 on;
  server_name sarhsa.online www.sarhsa.online;

  ssl_certificate /etc/letsencrypt/live/sarhsa.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sarhsa.online/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SarhSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 32m;

  include /etc/nginx/includes/admin-location.conf;
  include /etc/nginx/includes/butcher-location.conf;
  include /etc/nginx/includes/butcher-api-location.conf;

  location /privacy {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /join {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /join/success {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  include /etc/nginx/includes/payment-bridge.conf;

  location /socket.io/ {
    set $socket_upstream socket:3002;
    proxy_pass http://$socket_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
  }

  include /etc/nginx/includes/web-location.conf;
}

