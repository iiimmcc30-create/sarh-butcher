# Independent Malahem TLS edge. Do not overlay this onto /opt/sarh.
# Replace MALAHEM_DOMAIN after certificates exist. Do not reuse Sarh certs.
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/MALAHEM_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/MALAHEM_DOMAIN/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MalahemSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 32m;

  include /etc/nginx/includes/admin-location.conf;
  include /etc/nginx/includes/butcher-location.conf;
  include /etc/nginx/includes/butcher-api-location.conf;

  location /privacy {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /join {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /join/success {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  include /etc/nginx/includes/payment-bridge.conf;

  location /socket.io/ {
    set $socket_upstream socket:3002;
    proxy_pass http://$socket_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
  }
}
