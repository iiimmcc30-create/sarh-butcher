# Overlay used only on the Hostinger VPS when recreating Sarh nginx.
# Does not change /opt/sarh application code. Replaces the edge vhost files
# with the combined Sarh + Malahem SNI configs stored under /opt/sarh-butcher.
services:
  nginx:
    volumes:
      - /opt/sarh-butcher/nginx/hostinger-http.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/sarh-butcher/nginx/hostinger-ssl.conf:/etc/nginx/conf.d/ssl-server.conf:ro
      - /opt/sarh-butcher/nginx/butcher-api-location.conf:/etc/nginx/includes/butcher-api-location.conf:ro
