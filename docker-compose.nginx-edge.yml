# Optional TLS volume extra for independent Malahem nginx.
# Use WITH docker-compose.prod.yml only.
# Do NOT compose this onto /opt/sarh or attach to sarh_internal.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.nginx-edge.yml up -d nginx
services:
  nginx:
    volumes:
      - ./nginx/nginx.ssl.server.conf:/etc/nginx/includes/ssl-server.conf:ro
      - ./nginx/hostinger-ssl.conf:/etc/nginx/conf.d/ssl-server.conf:ro
