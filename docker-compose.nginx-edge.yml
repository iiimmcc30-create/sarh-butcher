# Overlay for the existing SARH nginx service only.
# Used FROM /opt/sarh with:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.ssl.yml \
#     -f /opt/sarh-butcher/docker-compose.nginx-edge.yml \
#     --env-file .env.production up -d nginx
#
# Does not recreate SARH api/postgres/redis. Do not commit this into the SARH repo.
services:
  nginx:
    volumes:
      - /opt/sarh-butcher/nginx/hostinger-http.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/sarh-butcher/nginx/hostinger-ssl.conf:/etc/nginx/conf.d/ssl-server.conf:ro
      - /opt/sarh-butcher/nginx/butcher-api-location.conf:/etc/nginx/includes/butcher-api-location.conf:ro
