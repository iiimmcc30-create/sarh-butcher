# ملاحم سرح — production-shaped stack (STAGING first).
# Do NOT point this file at SARH postgres/redis/NI webhook/JWT.
# Do NOT deploy to production in Phase 1.
name: sarh-butcher

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sarh_butcher}
    volumes:
      - butcher_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - butcher_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - butcher_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - butcher_internal

  api:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    image: sarh-butcher-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVICE_MODE: api
      PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh_butcher}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh_butcher}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      REDIS_KEY_PREFIX: butcherapp:
      APP_DEEP_LINK_SCHEME: ${APP_DEEP_LINK_SCHEME:-malahm}
      APP_ANDROID_PACKAGE: ${APP_ANDROID_PACKAGE:-com.sarh.butcher}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-sarh-butcher}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'
    networks:
      - butcher_internal
    entrypoint: ['./docker-entrypoint.sh']

  worker:
    image: sarh-butcher-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVICE_MODE: worker
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh_butcher}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh_butcher}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      REDIS_KEY_PREFIX: butcherapp:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - butcher_internal
    entrypoint: ['./docker-entrypoint.sh']

  socket:
    image: sarh-butcher-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVICE_MODE: socket
      PORT: '3002'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh_butcher}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh_butcher}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      REDIS_KEY_PREFIX: butcherapp:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3002:3002'
    networks:
      - butcher_internal
    entrypoint: ['./docker-entrypoint.sh']

  admin:
    build:
      context: ./admin-panel
      args:
        NEXT_PUBLIC_ADMIN_BASE_PATH: /admin
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://sarhsa.online/api/butcher}
    restart: unless-stopped
    environment:
      PORT: '3000'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      NEXT_PUBLIC_ADMIN_BASE_PATH: /admin
    networks:
      - butcher_internal

  butcher:
    build:
      context: ./butcher-dashboard
      args:
        NEXT_PUBLIC_BUTCHER_BASE_PATH: /butcher
    restart: unless-stopped
    environment:
      PORT: '3003'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      NEXT_PUBLIC_BUTCHER_BASE_PATH: /butcher
    networks:
      - butcher_internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - socket
      - admin
      - butcher
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/butcher-location.conf:/etc/nginx/includes/butcher-location.conf:ro
      - ./nginx/admin-location.conf:/etc/nginx/includes/admin-location.conf:ro
      - ./nginx/payment-bridge.conf:/etc/nginx/includes/payment-bridge.conf:ro
      - ./nginx/butcher-api-location.conf:/etc/nginx/includes/butcher-api-location.conf:ro
      - ./nginx/web-location.conf:/etc/nginx/includes/web-location.conf:ro
      - ./nginx/ssl-redirect.conf:/etc/nginx/includes/ssl-redirect.conf:ro
    networks:
      - butcher_internal

volumes:
  butcher_postgres_data:
  butcher_redis_data:

networks:
  butcher_internal:
    driver: bridge
