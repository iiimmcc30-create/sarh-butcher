# ملاحم سرح — Hostinger edge stack on the shared sarhsa.online VPS.
# Isolated Postgres/Redis/API/Worker/Socket. Does NOT run SARH services.
# Does NOT publish :3001/:3002 (those belong to SARH).
# Attach api/socket to the existing sarh_internal network for nginx only.
name: sarh-butcher

services:
  butcher-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sarh_butcher}
    command: postgres -c shared_buffers=64MB -c max_connections=50
    volumes:
      - butcher_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    networks:
      - butcher_internal

  butcher-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction
    volumes:
      - butcher_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 80m
    networks:
      - butcher_internal

  butcher-api:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    image: sarh-butcher-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      SERVICE_MODE: api
      PORT: '3001'
      NODE_OPTIONS: --max-old-space-size=256
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      REDIS_HOST: butcher-redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      REDIS_KEY_PREFIX: 'butcherapp:'
      JWT_ISSUER: malahm-sarh
      APP_DEEP_LINK_SCHEME: malahm
      APP_ANDROID_PACKAGE: com.sarh.butcher
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-sarh-butcher}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://sarhsa.online/api/butcher}
    depends_on:
      butcher-postgres:
        condition: service_healthy
      butcher-redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3101:3001'
    mem_limit: 320m
    networks:
      butcher_internal:
      sarh_internal:
        aliases: [butcher-api]
    entrypoint: ['./docker-entrypoint.sh']

  worker:
    image: sarh-butcher-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      SERVICE_MODE: worker
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      REDIS_HOST: butcher-redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      REDIS_KEY_PREFIX: 'butcherapp:'
    depends_on:
      butcher-postgres:
        condition: service_healthy
      butcher-redis:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - butcher_internal
    entrypoint: ['./docker-entrypoint.sh']

  butcher-socket:
    image: sarh-butcher-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      SERVICE_MODE: socket
      PORT: '3002'
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      REDIS_HOST: butcher-redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      REDIS_KEY_PREFIX: 'butcherapp:'
    depends_on:
      butcher-postgres:
        condition: service_healthy
      butcher-redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3102:3002'
    mem_limit: 224m
    networks:
      butcher_internal:
      sarh_internal:
        aliases: [butcher-socket]
    entrypoint: ['./docker-entrypoint.sh']

volumes:
  butcher_postgres_data:
  butcher_redis_data:

networks:
  butcher_internal:
    driver: bridge
  sarh_internal:
    external: true
    name: sarh_internal
