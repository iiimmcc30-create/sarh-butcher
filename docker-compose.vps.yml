# ملاحم سرح — independent VPS stack. Does NOT join sarh_internal.
# All services attach only to malahem_internal.
# Public URLs must come from MALAHEM_* / PUBLIC_* env — no baked domain.
name: sarh-butcher

services:
  butcher-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sarh_butcher}
    command: postgres -c shared_buffers=64MB -c max_connections=50
    volumes:
      - butcher_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    networks:
      - malahem_internal

  butcher-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction
    volumes:
      - butcher_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 80m
    networks:
      malahem_internal:
        aliases: [redis]

  butcher-api:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    image: sarh-butcher-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      SERVICE_MODE: api
      PORT: '3001'
      NODE_OPTIONS: --max-old-space-size=256
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      REDIS_HOST: butcher-redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      REDIS_KEY_PREFIX: 'butcherapp:'
      JWT_ISSUER: malahm-sarh
      APP_DEEP_LINK_SCHEME: malahm
      APP_ANDROID_PACKAGE: com.sarh.butcher
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-sarh-butcher}
      APP_URL: ${MALAHEM_APP_URL:-${APP_URL:?set MALAHEM_APP_URL or APP_URL}}
      PUBLIC_API_URL: ${MALAHEM_API_URL:-${PUBLIC_API_URL:?set MALAHEM_API_URL or PUBLIC_API_URL}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-true}
      FIREBASE_PRIVATE_KEY_FILE: /run/secrets/firebase-private-key.pem
    volumes:
      - ./secrets/firebase-private-key.pem:/run/secrets/firebase-private-key.pem:ro
    depends_on:
      butcher-postgres:
        condition: service_healthy
      butcher-redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3101:3001'
      - '172.20.0.1:3101:3001'
    mem_limit: 320m
    networks:
      malahem_internal:
        aliases: [api, butcher-api]
    entrypoint: ['./docker-entrypoint.sh']

  worker:
    image: sarh-butcher-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      SERVICE_MODE: worker
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      REDIS_HOST: butcher-redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      REDIS_KEY_PREFIX: 'butcherapp:'
      FIREBASE_PRIVATE_KEY_FILE: /run/secrets/firebase-private-key.pem
    volumes:
      - ./secrets/firebase-private-key.pem:/run/secrets/firebase-private-key.pem:ro
    depends_on:
      butcher-postgres:
        condition: service_healthy
      butcher-redis:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - malahem_internal
    entrypoint: ['./docker-entrypoint.sh']

  butcher-socket:
    image: sarh-butcher-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      SERVICE_MODE: socket
      PORT: '3002'
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@butcher-postgres:5432/${POSTGRES_DB:-sarh_butcher}
      REDIS_HOST: butcher-redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      REDIS_KEY_PREFIX: 'butcherapp:'
      FIREBASE_PRIVATE_KEY_FILE: /run/secrets/firebase-private-key.pem
    volumes:
      - ./secrets/firebase-private-key.pem:/run/secrets/firebase-private-key.pem:ro
    depends_on:
      butcher-postgres:
        condition: service_healthy
      butcher-redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3102:3002'
      - '172.20.0.1:3102:3002'
    mem_limit: 224m
    networks:
      malahem_internal:
        aliases: [socket, butcher-socket]
    entrypoint: ['./docker-entrypoint.sh']

  admin:
    build:
      context: ./admin-panel
      args:
        NEXT_PUBLIC_ADMIN_BASE_PATH: /admin
        NEXT_PUBLIC_API_URL: ${MALAHEM_API_URL:-${NEXT_PUBLIC_API_URL:?set MALAHEM_API_URL or NEXT_PUBLIC_API_URL}}
        NEXT_PUBLIC_SOCKET_URL: ${MALAHEM_APP_URL:-${NEXT_PUBLIC_SOCKET_URL:?set MALAHEM_APP_URL or NEXT_PUBLIC_SOCKET_URL}}
    restart: unless-stopped
    environment:
      PORT: '3000'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      NEXT_PUBLIC_API_URL: ${MALAHEM_API_URL:-${NEXT_PUBLIC_API_URL}}
      NEXT_PUBLIC_SOCKET_URL: ${MALAHEM_APP_URL:-${NEXT_PUBLIC_SOCKET_URL}}
      NEXT_PUBLIC_ADMIN_BASE_PATH: /admin
    ports:
      - '127.0.0.1:3100:3000'
      - '172.20.0.1:3100:3000'
    networks:
      - malahem_internal
    profiles: ['frontends']

  butcher:
    build:
      context: ./butcher-dashboard
      args:
        NEXT_PUBLIC_BUTCHER_BASE_PATH: /butcher
        NEXT_PUBLIC_API_URL: ${MALAHEM_API_URL:-${NEXT_PUBLIC_API_URL:?set MALAHEM_API_URL or NEXT_PUBLIC_API_URL}}
        NEXT_PUBLIC_SOCKET_URL: ${MALAHEM_APP_URL:-${NEXT_PUBLIC_SOCKET_URL:?set MALAHEM_APP_URL or NEXT_PUBLIC_SOCKET_URL}}
    restart: unless-stopped
    environment:
      PORT: '3003'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      NEXT_PUBLIC_API_URL: ${MALAHEM_API_URL:-${NEXT_PUBLIC_API_URL}}
      NEXT_PUBLIC_SOCKET_URL: ${MALAHEM_APP_URL:-${NEXT_PUBLIC_SOCKET_URL}}
      NEXT_PUBLIC_BUTCHER_BASE_PATH: /butcher
    ports:
      - '127.0.0.1:3103:3003'
      - '172.20.0.1:3103:3003'
    networks:
      - malahem_internal
    profiles: ['frontends']

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - butcher-api
      - butcher-socket
      - admin
      - butcher
    # Do not bind host :80/:443 — Sarh nginx already owns those on this VPS.
    # Public HTTPS waits for MALAHEM_DOMAIN. Internal edge only:
    ports:
      - '127.0.0.1:3180:80'
    profiles: ['frontends']
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/butcher-location.conf:/etc/nginx/includes/butcher-location.conf:ro
      - ./nginx/admin-location.conf:/etc/nginx/includes/admin-location.conf:ro
      - ./nginx/payment-bridge.conf:/etc/nginx/includes/payment-bridge.conf:ro
      - ./nginx/butcher-api-location.conf:/etc/nginx/includes/butcher-api-location.conf:ro
      - ./nginx/ssl-redirect.conf:/etc/nginx/includes/ssl-redirect.conf:ro
    networks:
      - malahem_internal

volumes:
  butcher_postgres_data:
  butcher_redis_data:

networks:
  malahem_internal:
    driver: bridge
